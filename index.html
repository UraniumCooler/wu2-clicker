<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>State clicker</title>
</head>

<body>
    <audio id="swoosh" src="audio/607251__d4xx__swoosh-2.wav"></audio>
    </header>
    
    <main class="upgcontainer">
        <article class="game">
            <div class="w-100">
                <h2>Upgrades</h2>
                <div id="upgradelist"></div>
            </div>
        </article>
    </main>
    <main class="infocontainer">
        <article class="game">
            <div class="game-hud">
                <ul class="game-currency">
                    <li class="item">
                        <h3><span id="money"></span>Money</h3>
                        <li class="item">
                            <h3><span id="mpc"></span>Money per click</h3>
                        </li>
                        <li class="item">
                            <h3><span id="mps"></span>Money per second</h3>
                        </li>
                        <li class="item">
                            <h3><span id="upgrades"></span>Upgrades</h3>
                        </li>
                    </li>
                </ul>
            </div>
        </article> 
    </main>
    <nav>
        <input type="checkbox" id="check">
        <label for="check" class="checkbtn">
          <i class="fas fa-bars"></i>
        </label>
        <div class="nav-mobile">
                <div>
                    <p>Hjälp till att fixa fel och lägga till funktioner:</p>
                    <ul>
                        <li>
                            <a href="https://github.com/jensnti/clicker/issues">issues</a>
                        </li>
                        <li>
                            <a href="https://github.com/jensnti/clicker/pulls">pull requests</a>.
                        </li>
                    </ul>
                </div>
        </div>
    </nav>
    <div class="buttonContainer">
        <div class="game-controls">
            <button id="game-button">
                
            </button>
        </div>
    </div>
    <div id="msgbox"></div>
    <footer class="containerFooter">
        
    </footer>
    <script src="js/clicker.js"></script>
</body>

</html>
